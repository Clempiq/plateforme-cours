<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc"><title id="title">Le circuit électrique</title><desc id="desc">Un circuit fermé permet au courant de circuler. La pile fournit l’énergie électrique. L’interrupteur permet d’ouvrir ou de fermer le circuit. Une lampe convertit l’énergie électrique en lumière et en chaleur.</desc><rect width="800" height="1000" fill="#fafbf6"/><rect x="0" width="800" height="12" fill="#286348"/><g font-family="Arial,sans-serif" fill="#213b31"><text x="60" y="80" font-size="13" letter-spacing="2" fill="#62794d">ESPACE DE COURS · DÉMONSTRATION</text><text x="60" y="145" font-size="34" font-weight="700">Le circuit électrique</text><text x="60" y="180" font-size="13" fill="#62794d">FICHE DE COURS · PHYSIQUE-CHIMIE</text><g stroke="#286348" stroke-width="4" fill="none"><path d="M200 260h155m30 0h215v180H200V260m155-20v40m30-55v70M320 440h30m0 0 60-30m0 30h40"/><circle cx="600" cy="350" r="35" fill="#fffaf0"/><path d="m577 327 46 46m-46 0 46-46"/></g><g font-size="18" fill="#53674f"><text x="350" y="205">Pile</text><text x="320" y="485">Interrupteur</text><text x="650" y="356">Lampe</text></g><text x="60" y="585" font-size="17">Un circuit fermé permet au courant de circuler.</text><text x="60" y="639" font-size="17">La pile fournit l’énergie électrique.</text><text x="60" y="693" font-size="17">L’interrupteur permet d’ouvrir ou de fermer le circuit.</text><text x="60" y="747" font-size="17">Une lampe convertit l’énergie électrique en lumière et en chaleur.</text><path d="M60 870h680" stroke="#d7e1ce"/><text x="60" y="910" font-size="13" fill="#67765f">Support fictif pour découvrir l’application. À adapter à votre cours.</text></g></svg>