<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc"><title id="title">L’énergie se transforme</title><desc id="desc">Une lampe : électrique → lumineuse et thermique. Un moteur : électrique → mécanique et thermique. Un panneau photovoltaïque : lumineuse → électrique. L’énergie se conserve : elle se transfère et se convertit.</desc><rect width="800" height="1000" fill="#fafbf6"/><rect x="0" width="800" height="12" fill="#286348"/><g font-family="Arial,sans-serif" fill="#213b31"><text x="60" y="80" font-size="13" letter-spacing="2" fill="#62794d">ESPACE DE COURS · DÉMONSTRATION</text><text x="60" y="145" font-size="34" font-weight="700">L’énergie se transforme</text><text x="60" y="180" font-size="13" fill="#62794d">MÉMO · PHYSIQUE-CHIMIE</text><rect x="110" y="245" width="230" height="100" rx="14" fill="#eaf0df"/><text x="225" y="300" text-anchor="middle" font-size="22" fill="#286348">Énergie électrique</text><path d="M360 295h70m-15-15 15 15-15 15" stroke="#286348" stroke-width="4" fill="none"/><rect x="450" y="245" width="240" height="100" rx="14" fill="#f7eedb"/><text x="570" y="290" text-anchor="middle" font-size="20">Lumière</text><text x="570" y="320" text-anchor="middle" font-size="20">+ chaleur</text><text x="60" y="585" font-size="17">Une lampe : électrique → lumineuse et thermique.</text><text x="60" y="639" font-size="17">Un moteur : électrique → mécanique et thermique.</text><text x="60" y="693" font-size="17">Un panneau photovoltaïque : lumineuse → électrique.</text><text x="60" y="747" font-size="17">L’énergie se conserve : elle se transfère et se convertit.</text><path d="M60 870h680" stroke="#d7e1ce"/><text x="60" y="910" font-size="13" fill="#67765f">Support fictif pour découvrir l’application. À adapter à votre cours.</text></g></svg>